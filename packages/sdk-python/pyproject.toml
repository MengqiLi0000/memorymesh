[project]
name = "memory-mesh-sdk"
version = "0.1.0"
description = "Python SDK for the Memory Mesh REST API"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_mesh_sdk"]
