[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-mesh-persona-lab"
version = "0.1.0"
description = "Experimental: persona (behavior) vectors for small open-weight LMs -- extraction, monitoring, steering. Not part of Memory Mesh core."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.2", "transformers>=4.44", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
persona-lab = "persona_lab.experiment:main"

[tool.setuptools]
packages = ["persona_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
